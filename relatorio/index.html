<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relatório de Crédito</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Bancada à esquerda, prévia do relatório (3 páginas A4) à direita. Tema claro obrigatório. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#1B2430; --ink2:#3F4855; --mut:#5B6573; --line:#D9DEE5; --line2:#EEF0F3;
  --acc:#1F5FBF; --acc-ink:#163F80; --acc-soft:#E4EEFB; --sel:#F5F9FE;
  --rep:#EEF0F3; --rep-ink:#2E3742; --calc:#E4EEFB; --calc-ink:#163F80; --prem:#FBEFD9; --prem-ink:#7A4508; --cl:#EFE7FA; --cl-ink:#4B2A85; --ofi:#E3F2EA; --ofi-ink:#1E5B2A;
  --risk:#C2620E; --opp:#2F7D45; --bad:#A3271B; --ok:#1E5B2A;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --f-head:"Space Grotesk",Inter,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)} a:hover{color:var(--acc-ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}
.en{display:block;font-size:10.5px;color:var(--mut);font-weight:400;line-height:1.25;letter-spacing:.01em}
.muted{color:var(--mut)} .small{font-size:12.5px} .xs{font-size:11.5px} .bad{color:var(--bad)} .ok{color:var(--ok)}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0}
/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.brand{font:700 16px var(--f-head);letter-spacing:-.01em;margin-right:4px}
.search{position:relative;flex:1 1 280px;max-width:420px}
.search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.sug{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(27,36,48,.12);max-height:360px;overflow:auto;z-index:40;margin-top:4px}
.sug button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;cursor:pointer}
.sug button:hover,.sug button:focus{background:var(--sel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff;font-weight:600}
.b{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:34px}
.b:hover{border-color:var(--acc)}
.b.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.b.pri:hover{background:var(--acc-ink)}
.b.cl{border-color:#B9A3E0;color:var(--cl-ink)}
.b:disabled{opacity:.55;cursor:default}
.link{border:0;background:none;color:var(--acc);cursor:pointer;padding:0;text-decoration:underline;font-size:inherit}
/* layout principal */
.main{display:flex;flex-wrap:wrap;gap:16px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:flex-start}
.work{flex:999 1 640px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.prev{flex:1 1 430px;min-width:0;max-width:560px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;background:#E7EBF0;border-radius:12px;padding:12px}
@media (max-width:1100px){.prev{position:static;max-height:none;max-width:none}}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{flex:1 0 auto;border:0;background:none;padding:12px 14px;cursor:pointer;font-size:13.5px;color:var(--ink2);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--acc-ink);font-weight:700;border-bottom-color:var(--acc)}
.tabs .cnt{font-size:11px;background:var(--line2);border-radius:9px;padding:1px 6px;margin-left:4px;color:var(--ink2)}
.pane{padding:18px;display:flex;flex-direction:column;gap:16px}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box>h3{font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.box>h3 .r{font:400 12px var(--f-body);color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.note{background:var(--line2);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--ink2)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--mut)}
/* tabelas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th{background:var(--line2);font-weight:600;padding:7px 8px;text-align:right;white-space:nowrap;position:sticky;top:0}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:210px}
table.t th:first-child{background:var(--line2)}
table.t td{padding:6px 8px;border-top:1px solid var(--line2);text-align:right;vertical-align:top}
table.t tr.g td{background:var(--bg);font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.05em;text-transform:uppercase}
table.t tr.g td:first-child{background:var(--bg)}
.v{border:0;background:none;padding:2px 3px;border-radius:4px;cursor:pointer;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.v:hover{background:var(--sel)}
.v .d{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.d.o-rep{background:#8C96A3}.d.o-calc{background:var(--acc)}.d.o-prem{background:#C98A1F}.d.o-claude{background:#7A55C2}.d.o-ofi{background:var(--opp)}
.chip{display:inline-flex;align-items:center;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:600;white-space:nowrap;border:0}
.o-rep{background:var(--rep);color:var(--rep-ink)} .o-calc{background:var(--calc);color:var(--calc-ink)} .o-prem{background:var(--prem);color:var(--prem-ink)} .o-claude{background:var(--cl);color:var(--cl-ink)} .o-ofi{background:var(--ofi);color:var(--ofi-ink)}
.i{width:20px;height:20px;border-radius:10px;border:1px solid var(--acc);background:var(--surface);color:var(--acc);font:600 11px var(--f-body);cursor:pointer;padding:0;flex:none}
/* popover de origem */
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid #C9D3E0;border-radius:10px;box-shadow:0 12px 32px rgba(27,36,48,.18);padding:14px;width:min(380px,calc(100vw - 32px));font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.pop h4{margin:0;font:600 13.5px var(--f-body);display:flex;justify-content:space-between;gap:8px}
.eq{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:6px;padding:8px 10px}
.eq .l1{font-weight:600}
/* inputs */
input.n,select.s,input.tx,textarea.tx{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface)}
input.n{width:84px;text-align:right;font-variant-numeric:tabular-nums}
textarea.tx{width:100%;resize:vertical;min-height:70px;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
/* cenários */
.cat{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.05em;text-transform:uppercase;margin-top:6px}
.sc{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;border:1px solid transparent;cursor:pointer;width:100%;background:none;text-align:left}
.sc:hover{background:var(--sel)} .sc.on{background:var(--sel);border-color:var(--acc)}
.bar{flex:none;width:58px;height:7px;background:var(--line2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:7px}
.thermo{display:flex;align-items:center;gap:10px}
.thermo input[type=range]{flex:1;accent-color:var(--risk)}
.thermo.opp input[type=range]{accent-color:var(--opp)}
.tree{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.node{border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:12.5px;background:var(--surface)}
.node.root{border-color:var(--ink)}
.arr{width:22px;height:1px;background:var(--mut);flex:none}
.rampa{display:flex;gap:10px;align-items:flex-end;height:90px}
.rampa div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px}
.rampa i{width:38px;border-radius:3px;background:var(--risk);display:block}
.sugbox{border:1px solid #B9A3E0;background:#FBF9FE;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
/* caixas de análise */
.cx{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cx.m-nao{opacity:.55}
.cx.m-enfase{border:2px solid var(--acc);background:var(--sel)}
.marks{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.marks button{flex:1;border:0;background:var(--surface);padding:8px 4px;cursor:pointer;font-size:12px}
.marks button+button{border-left:1px solid var(--line)}
.marks button[aria-pressed="true"]{background:var(--acc);color:#fff;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:4px 11px;cursor:pointer;font-size:12px}
.pills button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
/* prévia A4 */
.pghead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink2);margin-bottom:8px;gap:8px;flex-wrap:wrap}
.sheetwrap{width:100%;overflow:hidden;margin-bottom:12px}
.sheet{width:794px;min-height:1123px;background:#fff;color:#1B2430;box-shadow:0 2px 10px rgba(27,36,48,.15);transform-origin:top left;padding:52px 56px 40px;display:flex;flex-direction:column;gap:14px;font:12.5px/1.5 var(--f-body);position:relative}
.sheet.over{outline:3px solid var(--bad)}
.sheet h1{font-size:26px}
.sheet h2{font-size:15px;margin-top:2px}
.sheet .tese{background:#F1F3F6;border-radius:4px;padding:14px 16px;font-size:13px;line-height:1.55}
.sheet .tese.vazia{color:var(--mut);font-style:italic}
.sheet p{margin:0;text-align:justify}
.sheet .blk b.tt{font-weight:700}
.sheet .emph{font-weight:600}
.sheet table{border-collapse:collapse;width:100%;font-size:11.5px}
.sheet th{background:#E9ECF1;padding:5px 6px;text-align:right;font-weight:600}
.sheet th:first-child,.sheet td:first-child{text-align:left}
.sheet td{padding:4px 6px;border-top:1px solid #EEF0F3;text-align:right}
.sheet .fig{font-weight:600;font-size:12px;border-bottom:1px solid #1B2430;padding-bottom:3px}
.sheet .foot{margin-top:auto;display:flex;justify-content:space-between;font-size:10px;color:#5B6573;border-top:1px solid #D9DEE5;padding-top:6px}
.sheet .src{font-size:9.5px;color:#5B6573;line-height:1.4}
.sheet .logo{width:64px;height:64px;object-fit:contain;flex:none}
.sheet .logoph{width:64px;height:64px;border:1px dashed #8C96A3;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#5B6573;text-align:center;flex:none}
.sheet sup{font-size:8px;color:#163F80}
.overmsg{color:var(--bad);font-size:12px;font-weight:600}
.pdfhost{position:fixed;left:-10000px;top:0}
.pdfhost .sheet{transform:none!important;box-shadow:none}
/* modal */
.modal{position:fixed;inset:0;background:rgba(27,36,48,.35);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal>div{background:var(--surface);border-radius:12px;max-width:760px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:9px 14px;font-size:13px;z-index:80}
.hero{padding:28px;display:flex;flex-direction:column;gap:12px}
.hero h1{font-size:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.aviso{background:#FBEFD9;color:#7A4508;font-size:12.5px;padding:7px 16px;border-bottom:1px solid #EBD3A8}
</style>

<header class="top" id="top"></header>
<div class="aviso" role="note">Versão fora do claude.ai: os botões do Claude abrem um pedido para copiar e colar numa conversa do Claude, e a análise fica salva só neste navegador. Buscar notícias e ler links pelo navegador do app Claude não funcionam aqui; cole o texto no anexo.</div>
<main class="main">
  <section class="work" id="work" aria-label="Bancada"></section>
  <aside class="prev" id="prev" aria-label="Prévia do relatório"></aside>
</main>
<div id="pop" hidden></div>
<div id="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="dbg" hidden style="position:fixed;left:8px;bottom:8px;max-width:70vw;background:#FDECEA;color:#A3271B;font-size:11px;padding:6px 8px;border-radius:6px;z-index:90"></div>

<script>window.addEventListener("error",e=>{const d=document.getElementById("dbg");if(d){d.hidden=false;d.textContent+=" | "+e.message+" @"+(e.filename||"").split("/").pop()+":"+e.lineno;}});window.addEventListener("unhandledrejection",e=>{const d=document.getElementById("dbg");if(d){d.hidden=false;d.textContent+=" | promessa: "+(e.reason&&e.reason.message||e.reason);}});</script>
<script src="graficos.js?v=12"></script>
<script src="motor.js?v=12"></script>
<script src="claude.js?v=12"></script>
<script src="relatorio.js?v=12"></script>
<script src="ui.js?v=12"></script>
<script src="claude-externo.js?v=1"></script>
